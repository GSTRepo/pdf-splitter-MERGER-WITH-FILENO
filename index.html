<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kerala GST – PDF Utility</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 0;
}
.container {
    max-width: 900px;
    margin: 30px auto;
    background: #fff;
    padding: 25px;
    border-radius: 8px;
}
h1 {
    text-align: center;
    color: #003366;
}
.section {
    margin-top: 25px;
    padding: 15px;
    border: 1px solid #ddd;
    border-radius: 6px;
}
label {
    font-weight: bold;
}
input, button {
    margin-top: 8px;
}
button {
    padding: 8px 14px;
    cursor: pointer;
}
.log {
    margin-top: 10px;
    font-size: 14px;
    color: #333;
}
.footer {
    margin-top: 25px;
    font-size: 12px;
    color: #666;
    text-align: center;
}
</style>
</head>

<body>
<div class="container">
<h1>Kerala GST – PDF Utility</h1>

<div class="section">
<label>Select PDF files (password-protected allowed):</label><br>
<input type="file" id="pdfFiles" accept="application/pdf" multiple>
</div>

<div class="section">
<label>PDF Password (leave blank if none):</label><br>
<input type="password" id="pdfPassword" placeholder="Enter password once">
</div>

<div class="section">
<button onclick="mergePDFs()">Merge PDFs</button>
<button onclick="splitPDF()">Split PDFs</button>
</div>

<div class="log" id="log"></div>

<div class="footer">
All processing happens locally in your browser. No files are uploaded.
</div>
</div>

<script>
const { PDFDocument } = PDFLib;

function log(msg) {
    document.getElementById("log").innerHTML += msg + "<br>";
}

async function loadPdf(file, password) {
    const bytes = await file.arrayBuffer();
    try {
        return await PDFDocument.load(bytes, password ? { password } : {});
    } catch (e) {
        throw new Error("Wrong password or corrupted file: " + file.name);
    }
}

async function mergePDFs() {
    document.getElementById("log").innerHTML = "";
    const files = document.getElementById("pdfFiles").files;
    const password = document.getElementById("pdfPassword").value;

    if (!files.length) {
        alert("Select at least one PDF");
        return;
    }

    const mergedPdf = await PDFDocument.create();

    try {
        for (let i = 0; i < files.length; i++) {
            log("Reading: " + files[i].name);
            const pdf = await loadPdf(files[i], password);
            const pages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
            pages.forEach(p => mergedPdf.addPage(p));
        }

        const bytes = await mergedPdf.save();
        download(bytes, "Merged_PDF.pdf");
        log("✔ Merge completed");
    } catch (e) {
        alert(e.message);
    }
}

async function splitPDF() {
    document.getElementById("log").innerHTML = "";
    const files = document.getElementById("pdfFiles").files;
    const password = document.getElementById("pdfPassword").value;

    if (!files.length) {
        alert("Select PDFs to split");
        return;
    }

    const zip = new JSZip();

    try {
        for (let f = 0; f < files.length; f++) {
            const pdf = await loadPdf(files[f], password);
            const pageCount = pdf.getPageCount();

            for (let i = 0; i < pageCount; i++) {
                const newPdf = await PDFDocument.create();
                const [page] = await newPdf.copyPages(pdf, [i]);
                newPdf.addPage(page);
                const bytes = await newPdf.save();
                zip.file(`${files[f].name}_page_${i + 1}.pdf`, bytes);
            }
        }

        const content = await zip.generateAsync({ type: "blob" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(content);
        a.download = "Split_PDFs.zip";
        a.click();

        log("✔ Split completed");
    } catch (e) {
        alert(e.message);
    }
}

function download(bytes, filename) {
    const blob = new Blob([bytes], { type: "application/pdf" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    link.click();
}
</script>
</body>
</html>
